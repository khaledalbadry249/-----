<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختصر النصيحة في الأذكار — عدّاد ومسبحة</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e1c3d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الأذكار">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff6e5;--bg2:#e8f4ff;--card:#fff;--ink:#2a2540;--mut:#7a7595;--ok1:#3ed598;--ok2:#12a56b;--ring:#e9e4f5;--sh:0 8px 20px rgba(60,40,120,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1838;--bg2:#10213a;--card:#2a2450;--ink:#f4f0ff;--mut:#a9a3c9;--ring:#403a6b;--sh:0 8px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg1:#1d1838;--bg2:#10213a;--card:#2a2450;--ink:#f4f0ff;--mut:#a9a3c9;--ring:#403a6b;--sh:0 8px 20px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;font-family:'Cairo',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1);padding-bottom:96px;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
header{padding:18px 18px 6px;display:flex;align-items:center;gap:12px}
h1{font-size:20px;margin:0;font-weight:900;line-height:1.3}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.back{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-size:20px}
main{padding:10px 16px;max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{background:var(--card);border-radius:26px;padding:14px 8px 12px;box-shadow:var(--sh);text-align:center;transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile svg{width:92px;height:92px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.tile b{display:block;font-size:15px;margin-top:6px}
.tile small{color:var(--mut);font-size:11px}
.card{position:relative;background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;transition:background .4s,transform .12s}
.card:active{transform:scale(.985)}
.card .tx{flex:1;font-family:'Amiri',serif;font-size:21px;line-height:2;min-width:0}
.card .side{display:flex;flex-direction:column;align-items:center;gap:8px}
.ringbox{position:relative;width:68px;height:68px}
.ringbox svg{width:68px;height:68px;transform:rotate(-90deg)}
.ringbox span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px}
.mini{display:flex;gap:6px}
.mini button{width:32px;height:32px;border-radius:11px;background:var(--ring);font-size:15px}
.pg{position:absolute;top:-8px;right:14px;background:#ffb703;color:#4a3000;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px}
.card.done{background:linear-gradient(135deg,var(--ok1),var(--ok2));color:#fff;animation:pop .5s}
.card.done .mini button{background:rgba(255,255,255,.28)}
.card.done .ringbox span{color:#fff}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05) rotate(-1deg)}70%{transform:scale(.98) rotate(1deg)}100%{transform:scale(1)}}
nav{position:fixed;inset:auto 0 0 0;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;background:linear-gradient(transparent,var(--bg2) 40%)}
nav button{flex:1;max-width:220px;padding:12px;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:15px}
nav button.on{background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff}
.beads{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px}
.chip{flex:0 0 auto;max-width:200px;padding:10px 14px;border-radius:18px;background:var(--card);box-shadow:var(--sh);font-family:'Amiri',serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff}
.big{margin:6px auto 0;text-align:center}
.bigring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:0 auto}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigbtn{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#a99bff,#6a4cff 55%,#3d28c8);box-shadow:0 14px 26px rgba(70,40,200,.45),inset 0 -8px 16px rgba(0,0,0,.25),inset 0 8px 14px rgba(255,255,255,.35);color:#fff;font-size:64px;font-weight:900;transition:transform .08s}
.bigbtn:active{transform:scale(.94)}
.bigbtn small{display:block;font-size:14px;font-weight:700;opacity:.85}
.bigbtn.done{background:radial-gradient(circle at 35% 28%,#7bf0bd,#12a56b 60%,#0b7a4d)}
.dtext{font-family:'Amiri',serif;font-size:22px;line-height:1.9;margin:14px 6px}
.ctrls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.ctrls button{padding:10px 16px;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:14px}
.stepper{display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:6px 10px;border-radius:16px;box-shadow:var(--sh);font-weight:900}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--ring);box-shadow:none;padding:0;font-size:18px}
.add{display:flex;gap:8px;margin-top:20px}
.add input{flex:1;padding:12px 14px;border-radius:16px;border:2px solid var(--ring);background:var(--card);color:var(--ink);font:inherit;font-size:15px;min-width:0}
.add button{padding:0 18px;border-radius:16px;background:linear-gradient(135deg,#ffb703,#fb8500);color:#fff;font-weight:900}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-90px);background:#2a2540;color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;font-size:14px;transition:transform .3s;z-index:9}
#toast.s{transform:translateX(-50%) translateY(0)}
#bg{position:fixed;inset:0;z-index:-1}#bg svg{width:100%;height:100%;display:block}
body.dk header h1,body.dk .sub,body.dk .dtext,body.dk .empty{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
header h1{text-shadow:0 1px 6px rgba(255,255,255,.5)}
.tgt{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.tgt>span{font-weight:700;font-size:13px;color:var(--mut);width:100%;text-align:center}
body.dk .tgt>span{color:#fff}
.tgt button{padding:9px 12px;border-radius:14px;background:var(--card);box-shadow:var(--sh);font-weight:900;font-size:14px;min-width:46px}
.tgt input{width:84px;padding:9px;border-radius:14px;border:2px solid #7c5cff;background:var(--card);color:var(--ink);font:inherit;font-weight:900;font-size:18px;text-align:center}
#bg svg *{transform-box:view-box}
@keyframes drift{from{transform:translateX(-34px)}to{transform:translateX(34px)}}.cd{animation:drift 30s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 40s linear infinite}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pl{animation:pl 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}.tw{animation:tw 3s ease-in-out infinite}
@keyframes fall{from{transform:translateY(-60px);opacity:0}15%{opacity:1}to{transform:translateY(640px);opacity:0}}.fall{animation:fall 7s linear infinite}
@keyframes rise{from{transform:translateY(60px);opacity:0}20%{opacity:.9}to{transform:translateY(-140px);opacity:0}}.rise{animation:rise 7s ease-in infinite}
@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(480px)}}.fly{animation:fly 18s linear infinite}
@keyframes bob{50%{transform:translateY(-8px)}}.bob{animation:bob 3s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.4}50%{transform:translate(14px,-22px);opacity:1}}.ff{animation:ff 6s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(9deg)}}#bg .sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){#bg svg *{animation:none!important}}
nav button{padding:12px 6px;font-size:14px}
.card{padding-top:20px}
.no{flex:0 0 auto;min-width:36px;height:36px;padding:0 8px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 4px 8px rgba(80,60,200,.35)}
.card.done .no{background:rgba(255,255,255,.3)}
.card .tx{font-size:22px;line-height:2.1}
.clkbox{background:var(--card);border-radius:24px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh);text-align:center}
.clk b{display:block;font-size:30px;font-weight:900;letter-spacing:1px}
.clk span{display:block;font-weight:700;font-size:15px}
.clk small{color:var(--mut);font-size:13px}
.prog{margin-top:8px;font-weight:700;font-size:13px;color:var(--mut)}
.okl{margin-top:8px;padding:8px 12px;border-radius:14px;background:linear-gradient(135deg,var(--ok1),var(--ok2));color:#fff;font-weight:700;font-size:14px}
.mlog{margin-top:8px;padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,#ffb703,#fb8500);color:#fff;font-weight:900;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats div{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font-size:20px;font-weight:900}.stats small{font-size:11px;color:var(--mut)}
.calh{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:8px 12px;margin-bottom:10px;box-shadow:var(--sh)}
.calh button{width:36px;height:36px;border-radius:12px;background:var(--ring);font-size:20px;font-weight:900}.calh button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border-radius:22px;padding:12px;box-shadow:var(--sh)}
.cal i{font-style:normal;text-align:center;min-height:50px}
.cal .wd{min-height:auto;font-weight:900;color:var(--mut);font-size:13px}
.cal .dy{border-radius:12px;background:var(--ring);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal .dy span{font-weight:700;font-size:13px}.cal .dy em{font-style:normal;font-size:13px;min-height:16px}
.cal .td{outline:3px solid #7c5cff}
.lh{font-size:17px;margin:20px 4px 10px}body.dk .lh{color:#fff}
.le{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.le .ic{font-size:28px}.le div{flex:1;min-width:0}.le b{display:block}.le span{display:block;font-size:14px}.le small{color:var(--mut);font-size:12px}
.le button{background:var(--ring);width:34px;height:34px;border-radius:11px}
.card .tx,.chip,.dtext{font-family:'Amiri','Scheherazade New',serif}
.zm{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:8;display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--card);box-shadow:var(--sh);opacity:.92}
.zm button{width:38px;height:38px;border-radius:12px;background:var(--ring);font-weight:900;font-size:15px}
.zm button:active{transform:scale(.92)}
.zm button{position:relative}
.zm button.lit{background:linear-gradient(135deg,#ffd23f,#fb8500);animation:glow 1.4s ease-in-out infinite}
.zm button.lit::after{content:'';position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,183,3,.75)}50%{box-shadow:0 0 0 11px rgba(255,183,3,0)}}
/* ===== نظام التصاميم ===== */
body.tx nav button.on,body.tx .chip.on,body.tx .no,body.tx .add button,body.tx .mlog{background:linear-gradient(135deg,var(--a1),var(--a2))}
body.tx .bigbtn{background:radial-gradient(circle at 35% 28%,var(--a1),var(--a2) 78%)}
body.tx .bigbtn.done{background:radial-gradient(circle at 35% 28%,#7bf0bd,#12a56b 60%,#0b7a4d)}
body.tx .cal .td{outline-color:var(--a1)}body.tx .tgt input{border-color:var(--a1)}
body.s-c,body.s-g{--tc:#1b1636;--hl:rgba(255,255,255,.95);--gl:rgba(255,255,255,.4);--okc:#0a8a55;--ring:rgba(120,100,170,.32)}
body.s-c.dk,body.s-g.dk{--tc:#fff;--hl:rgba(8,4,32,.92);--gl:rgba(20,10,60,.42);--okc:#7bf0bd;--ring:rgba(255,255,255,.3)}
body.s-c nav,body.s-g nav{background:none}
body.s-c :is(.card,.tile,.clkbox,.stats div,.cal,.calh,.le,.chip,.stepper){background:transparent;box-shadow:none}
body.s-c :is(.tgt button,.ctrls button,nav button,.zm,.add input,.back){background:var(--gl);box-shadow:none}
body.s-c .chip.on,body.s-c nav button.on{background:linear-gradient(135deg,var(--a1,#7c5cff),var(--a2,#4f8cff))}
body.s-c .card{border-radius:0;border-bottom:1px solid var(--ring)}
body.s-c .card.done{background:transparent;color:var(--tc)}
body.s-c .card.done .tx{color:var(--okc)}body.s-c .card.done .tx::before{content:'✓ '}
body.s-c .card.done .mini button{background:var(--ring)}
body.s-c .card.done .no{background:linear-gradient(135deg,#12a56b,#3ed598)}
body.s-g :is(.card,.tile,.clkbox,.stats div,.cal,.calh,.le,.chip,.stepper,.tgt button,.ctrls button,nav button,.zm,.add input,.back){background:var(--gl);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.3);box-shadow:0 4px 16px rgba(0,0,0,.1)}
body.s-g .chip.on,body.s-g nav button.on{background:linear-gradient(135deg,var(--a1,#7c5cff),var(--a2,#4f8cff))}
body.s-g .card.done{background:rgba(18,165,107,.5)}
body:is(.s-c,.s-g) :is(header h1,.sub,.dtext,.tgt>span,.lh,.empty){color:var(--tc);text-shadow:0 0 3px var(--hl),0 0 8px var(--hl),0 0 16px var(--hl)}
body:is(.s-c,.s-g) :is(.card .tx,.tile b,.tile small,.clkbox,.stats,.cal,.calh b,.le,.ringbox span,.prog,.stepper,.chip:not(.on),.tgt button,.ctrls button,nav button:not(.on),.add input){color:var(--tc)}
body:is(.s-c,.s-g) :is(.tile small,.stats small,.le small,.clk small,.cal .wd){color:var(--tc);opacity:.85}
body.s-g :is(.card .tx,.tile b,.clkbox,.le){text-shadow:0 1px 2px var(--hl)}
body.s-c :is(.card .tx,.tile b,.tile small,.clkbox,.stats,.cal,.calh b,.le,.ringbox span,.prog,.stepper,.chip:not(.on),.tgt button,.ctrls button,nav button:not(.on)){text-shadow:0 0 2px var(--hl),0 0 5px var(--hl),0 0 10px var(--hl),0 0 18px var(--hl)}
@keyframes lsw{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
#bg{transition:opacity .3s}
#ths{position:fixed;inset:0;z-index:30}
.shb{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.shp{position:absolute;inset:auto 0 0 0;max-height:80%;overflow:auto;background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--ink);border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.shp>b{display:block;font-size:16px}
.thg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 18px}
.thc{background:none;border-radius:18px;padding:5px;border:2px solid transparent;font-weight:700;font-size:13px;color:var(--ink)}
.thc.on{border-color:var(--a1,#7c5cff)}
.thc i{display:grid;place-items:center;height:72px;border-radius:13px;color:#fff;font-style:normal;font-family:'Amiri',serif;font-size:20px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.65)}
.thc span{display:block;margin-top:5px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;padding:10px 4px;border-radius:14px;background:var(--ring);font-weight:900;font-size:14px;color:var(--ink)}
.seg button.on{background:linear-gradient(135deg,var(--a1,#7c5cff),var(--a2,#4f8cff));color:#fff}
.shp small{display:block;margin-top:8px;color:var(--mut);font-size:12px}
/* ===== الخطوط ===== */
.card .tx,.chip,.dtext{font-family:var(--ft,'Amiri'),'Scheherazade New',serif;font-weight:var(--fw,400)}
body.fa{font-family:var(--ft),system-ui,sans-serif}
.zm button{width:34px}
@media(max-width:520px){header{padding-left:204px}}
.fpv{margin:12px 0 4px;padding:14px;border-radius:16px;background:var(--ring);text-align:center;font-size:24px;line-height:2;font-family:var(--ft,'Amiri'),serif;font-weight:var(--fw,400);color:var(--ink)}
.thc.fo i{background:var(--ring);color:var(--ink);text-shadow:none;font-size:21px}
/* ===== واجهة البداية ===== */
#toast{z-index:90}
#sp{position:fixed;inset:0;z-index:60;background:#0e1c3d;overflow:hidden;transition:opacity .6s,visibility .6s;user-select:none}
#sp.out{opacity:0;visibility:hidden;pointer-events:none}
.sp-bk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(22px) brightness(.55);transform:scale(1.1)}
@media(max-width:700px){.sp-bk{display:none}}
.sp-box{position:absolute;top:0;bottom:0;overflow:hidden}
.sp-st{position:absolute}
.sp-st>img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.sp-st>*{pointer-events:none}
.sp-sun{position:absolute;left:16.3%;top:44%;width:34%;aspect-ratio:1;margin:-17% 0 0 -17%;border-radius:50%;background:radial-gradient(circle,rgba(255,250,220,.85),rgba(255,225,160,.35) 35%,rgba(255,200,140,0) 70%);animation:spgl 5s ease-in-out infinite}
.sp-moon{position:absolute;left:88.5%;top:8.7%;width:20%;aspect-ratio:1;margin:-10% 0 0 -10%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 68%);animation:spgl 6s ease-in-out infinite}
@keyframes spgl{0%,100%{opacity:.35}50%{opacity:1}}
.sp-shine{position:absolute;left:11.7%;top:15.3%;width:77.5%;height:9.8%;overflow:hidden;border-radius:60px}
.sp-shine::after{content:'';position:absolute;top:0;bottom:0;width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-150%) skewX(-20deg);animation:spshine 7s ease-in-out infinite}
@keyframes spshine{0%,55%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(460%) skewX(-20deg)}}
.sx{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 35%,rgba(255,255,255,0) 70%);animation:sptw 3s ease-in-out infinite}
.ws{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));animation:sptw 3s ease-in-out infinite}
@keyframes sptw{0%,100%{opacity:.1}50%{opacity:1}}
.pf{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#ffeaa0 0,rgba(255,220,120,0) 70%);animation:spfl 9s ease-in-out infinite}
@keyframes spfl{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.bd{position:absolute;width:3.4%;left:-6%;animation:spbird 24s linear infinite}
.bd svg{display:block;width:100%}
@keyframes spbird{to{transform:translateX(var(--sw))}}
.sp-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:6vh 20px 0}
.sp-go{position:relative;display:flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;border:2px solid rgba(255,226,150,.95);background:linear-gradient(180deg,#fffaf0,#f7e6b4);color:#4a3412;font:900 22px/1.2 'Cairo',sans-serif;box-shadow:0 0 0 6px rgba(255,236,170,.25),0 10px 30px rgba(60,40,0,.35),0 0 40px rgba(255,225,140,.6)}
.sp-go::after{content:'';position:absolute;inset:-2px;border-radius:999px;border:2px solid rgba(255,236,170,.9);animation:sprg 3.2s ease-out infinite}
.sp-go:active{transform:scale(.95)}
.sp-go svg{width:22px;height:22px}
@keyframes sprg{from{transform:scale(1);opacity:.9}to{transform:scale(1.3,1.6);opacity:0}}
.sp-row{display:flex;gap:30px}
.spi{background:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.spi .ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.65);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.spi:active .ic{transform:scale(.92)}
.spi svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sp-bt{position:absolute;left:0;right:0;bottom:0;padding:64px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(rgba(8,24,40,0),rgba(8,24,40,.75));color:#fff3cf;font-family:'Amiri','Cairo',serif;text-shadow:0 2px 8px rgba(0,0,0,.65);pointer-events:none}
.sp-bt small{display:block;font-size:14px;opacity:.9}
.sp-bt b{display:block;font-size:22px;line-height:1.55;margin:2px 0;font-weight:700}
.sp-bt span{display:block;font-size:16px}
.sp-bt em{display:inline-block;font-style:normal;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;margin-top:10px;padding-top:7px;border-top:1px solid rgba(255,243,207,.4);opacity:.92}
.sp-dl{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(8,12,40,.55);padding:20px}
.sp-dl.on{display:grid}
.sp-cd{width:min(360px,100%);padding:22px 20px;border-radius:26px;text-align:center;background:linear-gradient(180deg,#fffaf0,#f7e6b4);border:2px solid #e8c970;color:#4a3412;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.sp-cd h3{margin:0 0 4px;font-size:19px;font-weight:900}
.sp-cd p{margin:6px 0 0;font-size:14px;min-height:42px}
.sp-stars{display:flex;justify-content:center;gap:4px;direction:ltr;margin:10px 0 2px}
.sp-stars button{background:none;width:46px;height:46px;padding:0}
.sp-stars svg{width:100%;height:100%;fill:none;stroke:#c9ab5e;stroke-width:1.6;stroke-linejoin:round}
.sp-stars .on svg{fill:#f5b301;stroke:#d99a00}
.sp-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sp-acts button{padding:10px 16px;border-radius:14px;font-weight:900;font-size:14px;background:linear-gradient(135deg,#ffb703,#fb8500);color:#fff}
.sp-acts .g{background:rgba(74,52,18,.12);color:#4a3412}
@media(prefers-reduced-motion:reduce){#sp *{animation:none!important}}
</style>

<script>
var K='﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾';
var AK='أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ: '+K+' [البقرة: ٢٥٥]';
var MS='قُلْ هُوَ اللهُ أَحَدٌ… وَقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ… وَقُلْ أَعُوذُ بِرَبِّ النَّاسِ…';
var SH='أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا، وَمَا كَانَ مِنَ الْمُشْرِكِينَ.';
var SHE='أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَكَلِمَةِ الْإِخْلَاصِ، وَدِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَمِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا، وَمَا كَانَ مِنَ الْمُشْرِكِينَ.';
var RB='رَضِيتُ بِاللهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا.';
var M3='اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.';
var E3='اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ.';
var T4='لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.';
var T5='يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ أَبَدًا.';
var SY='اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.';
var T8='اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَشَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.';
var M9='أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ، وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ، وَعَذَابٍ فِي الْقَبْرِ.';
var M9E='أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ، وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ، وَعَذَابٍ فِي الْقَبْرِ.';
var T10='اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ، وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِي، وَعَنْ يَمِينِي، وَعَنْ شِمَالِي، وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.';
var T11='اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.';
var M12='أَصْبَحْتُ أُثْنِي عَلَيْكَ حَمْدًا، وَأَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ.';
var E12='أَمْسَيْتُ أُثْنِي عَلَيْكَ حَمْدًا، وَأَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ.';
var E11='أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.';
var B13='بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ.';
var B14='سُبْحَانَ اللهِ عَدَدَ خَلْقِهِ، سُبْحَانَ اللهِ رِضَا نَفْسِهِ، سُبْحَانَ اللهِ زِنَةَ عَرْشِهِ، سُبْحَانَ اللهِ مِدَادَ كَلِمَاتِهِ.';
var B15a='اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ.';
var B15b='اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.';
var SW='سُوَرُ: الْإِخْلَاصِ، وَالْفَلَقِ، وَالنَّاسِ.';
var HS='﴿حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ﴾';
var M18='اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.';
var E17='اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.';
var L19='لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.';
var SAL='اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ.';
var TL1='سُبْحَانَ اللهِ وَبِحَمْدِهِ.',TL2='أَوْ: سُبْحَانَ اللهِ الْعَظِيمِ وَبِحَمْدِهِ.',ST='أَسْتَغْفِرُ اللهَ.';
